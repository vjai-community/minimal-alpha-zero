            ## 1. Overview
            ### 1.3. Challenges
            - システム設計: データパイプラインの処理は、モデルの学習そのものよりも難しく、完全に最適化するには<span class="color-cyan"><em>高度なエンジニアリングスキルが求められる</em></span>.
            - ボードゲームの特性:
              - 取り得る盤面の数は<span class="color-cyan"><em>天文学的に膨大</em></span>になり得る. 例えば、囲碁ではおよそ $10^{170}$ とされる.
              - 入力サイズは小さいが、情報は<span class="color-cyan"><em>非常に高密度</em></span>である.
              - ある局面の価値はプレイヤーの視点に依存しており、<span class="color-cyan"><em>わずかな変化でも大きく変動し得る</em></span>.
              - 序盤の局面から最終結果を<span class="color-cyan"><em>予測するのは難しく</em></span>、強いプレイヤーであっても容易ではない.
          </textarea>

          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.1. Key Features
            - 要件: 次の条件を満たす「モデル」（ニューラルネットワーク）:
              - ゲームの <span class="color-cyan"><em>state</em></span> を入力として受け取る.
              - <span class="color-cyan"><em>prior probabilities (policy)</em></span> と <span class="color-cyan"><em>state value</em></span> を含む出力を予測する.
            - 結果: 改善された <span class="color-cyan"><em>search probabilities</em></span>.

            <object data="slides/ja/mcts-key_features.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.2. Algorithm (1/2)
            #### Overview
            - 探索木を構築する:
              - 各 node は state を表す.
              - 各 edge は、親 node とその子 node の一つを結ぶ合法手を表す.
            - Initial state から terminal state まで木を探索する過程において:
              - <span class="color-cyan"><em>各 move</em></span> ごとに、現在の root node から<span class="color-cyan"><em>複数回の MCTS simulation</em></span> を実行する.
                - <span class="color-cyan"><em>各 simulation</em></span> は、主に2つのフェーズ: <span class="color-cyan"><em>選択</em></span>と<span class="color-cyan"><em>バックアップ</em></span>から構成される.
              - MCTS simulation が終了した後、 次の実際の move は <span class="color-cyan"><em>visit counts</em></span> に基づいて計算された <span class="color-cyan"><em>search probabilities からサンプリング</em></span>によって選択され、次の node が新しい root node となる.
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.2. Algorithm (2/2)
            <p style="font-size: initial;" class="color-yellow">IMPORTANT</p>
            <p style="font-size: initial;"><span class="color-cyan"><em>1回の MCTS simulation 中における action の選択</em></span>は、（このスライドに示されているように） <span class="color-cyan"><em>PUCT scores</em></span> に基づいて行われる.</p>
            <p style="font-size: initial;">一方で、<span class="color-cyan"><em>実際の次の move を選択する</em></span>際には、<span class="color-cyan"><em>複数回の MCTS simulation</em></span> を通じて蓄積された <span class="color-cyan"><em>search probabilities</em></span> に基づいてサンプリングが行われる.</p>
            <p>
              <object data="slides/ja/mcts-one_simulation.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
            </p>
            <p style="font-size: initial;">Please refer to the Appendix for further details.</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.3. Example: Tic-tac-toe Game (1/2)
            #### MCTS Simulations
            <p style="font-size: initial;">すべての action に<span class="color-cyan"><em>一様な prior probabilities</em></span> を割り当て、（terminal state を除く）すべての state に対して <span class="color-cyan"><em>value をゼロ</em></span>とするダミーモデルを用いる.</p>
            <p style="font-size: initial;">このような不完全な予測にもかかわらず、iteration 回数を重ねるにつれて、<span class="color-cyan"><em>勝利につながる node はますます高い頻度で訪問されるようになる</em></span>.</p>
            <p style="font-size: initial;" class="color-yellow">IMPORTANT</p>
            <p style="font-size: initial;">simulation 中には action が連続して選択されるが、これらは「調査」にすぎなく、実際の move は、すべての simulation が終了した後にのみ実行される.</p>
            <iframe data-src="slides/ja/mcts-example-multiple_simulations.html" data-preload class="wide-content" style="max-width: 100%; width: 100%; height: 100vh;"></iframe>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.3. Example: Tic-tac-toe Game (2/2)
            #### Choosing Next Move
            <p style="font-size: initial;"><span class="color-cyan"><em>複数回の MCTS simulation</em></span> を実行した後、<span class="color-cyan"><em>visit count</em></span> は <span class="color-cyan"><em>search probabilities</em></span> の計算に用いられ、良い次の move を選択するという点において、（モデルによって予測された）<span class="color-cyan"><em>prior probabilities</em></span> よりも強力である.</p>
            <p style="font-size: initial;">木探索は両プレイヤーの<span class="color-cyan"><em>役割を担い</em></span>、各 node において視点を切り替え、その時点のプレイヤーにとって最善の戦略を追求する.</p>
            <p>
              <object data="slides/ja/mcts-example-choosing_next_move.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
            </p>
            <p style="font-size: initial;">In this presentation, I used a temperature of 1 to calculate the search probabilities from visit counts.</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.4. Connection with Model Training
            MCTS simulation は、ある state に対してモデルの予測が不完全であっても、良い move を選択することができる.<br/>
            では、<span class="color-cyan"><em>なぜモデルを学習する必要があるのだろうか</em></span>? MCTS simulation だけでは不十分なのだろうか.<br/>
            <br/>
            その理由は、<span class="color-cyan"><em>MCTS simulation には多くの時間がかかり</em></span>、複雑なボードゲームでは実行が現実的でない場合があるからである.<br/>
            モデルを学習することは、<span class="color-cyan"><em>simulation の総数を増やすこと</em></span>に相当し、それによって <span class="color-cyan"><em>MCTS の強さをさらに向上させる</em></span>ことになる.<br/>
            <div style="font-size: 0.6em;">
              <ul>
                <li>Iteration 0: モデルはまだ未熟であり、良い move を見つけるためには、デフォルトで少なくとも100回の simulation を実行する必要がある.</li>
                <li>Iteration 1: モデルはやや改善され、デフォルトの100回の simulation で、合計200回の simulation を実行したのと同等の効果があり、より良い move を選択できるようになる.</li>
                <li>Iteration 2: モデルは大幅に改善され、現在では300回の simulation を実行したのと同等になり、さらに高いパフォーマンスを達成できる.</li>
                <li>...</li>
              </ul>
            </div>
          </textarea>
        </section>

            ## 3. Data Collection
            ### 3.1. Overview
            - データは、前回の iteration で得られた最良のモデルを用いた self-play によって生成されます.
            - 各データポイントには以下が含まれます:
              - Input data: 各 move における <span class="color-cyan"><em>state</em></span> を表す.
              - Output data: 以下の2つの要素を含む
                - <span class="color-cyan"><em>Search probabilities</em></span>: MCTS simulation における訪問回数に基づいて計算される.
                - <span class="color-cyan"><em>Value</em></span>: ゲーム終了後に得られる reward を表す.
          </textarea>

            ## 5. Minimal Implementation
            ### 5.1. Source Code
            [https://github.com/vjai-community/minimal-alpha-zero](https://github.com/vjai-community/minimal-alpha-zero)
            - <span class="color-cyan"><em>AlphaZero アルゴリズムをスクラッチから実装</em></span> (モデル学習には Flax を使用).
            - <span class="color-cyan"><em>小さな盤面</em></span>の [m,n,k-game](https://en.wikipedia.org/wiki/M,n,k-game) (m=6, n=5, k=4) で学習を実施.
            - モデルは<span class="color-cyan"><em>軽量</em></span>で、GPUを必要としない.
            - 学習は数時間以内に完了（マルチコアの MacBook や Ryzen 環境で動作）.
            - コントリビューション大歓迎! 🤗🤗

            <p style="display: flex; justify-content: center;">
              <object data="slides/ja/overview-mnk_game.drawio.svg" type="image/svg+xml" style="height: 25vh;"></object>
            </p>
          </textarea>

        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (1/3)
            #### Empty Board
            モデルは、空の盤面から開始する場合、<span class="color-cyan"><em>先手は盤面の中央に集中すべき</em></span>であることを学習した.
            <object data="slides/ja/interesting_insights-empty_board.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
            <p style="font-size: initial;">I never taught the model this knowledge; it figured it out on its own!</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (2/3)
            #### Threats
            学習後であっても、モデルは依然としてすべての脅威を認識できるほど賢くはなくて、<span class="color-cyan"><em>AlphaZero の強さの鍵は MCTS にある</em></span>.
            <object data="slides/ja/interesting_insights-threats.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (3/3)
            #### Others
            - <span class="color-cyan"><em>データの理解と処理は、モデル設計よりもはるかに重要</em></span>.
            - <span class="color-cyan"><em>データ収集は、モデルの学習よりも時間がかかる</em></span>.<br/>
            - 一般的に言って、<span class="color-cyan"><em>効果的な強化学習システムを実装することは大きな挑戦</em></span>.<br/>
            データパイプラインやリソースの制約から、モデルアーキテクチャの最適化、場合によってはハードウェア統合に至るまで、プロセスのあらゆる段階に対処しなければならない.
          </textarea>
        </section>

        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 6. Summary
            ### 6.1. Core Takeaways
            - Given enough time and a sufficiently large number of simulations, <span class="color-cyan"><em>MCTS can find the optimal path</em></span> to a high reward, regardless of how inaccurate the initial prior probabilities and state values are.
            - Training in AlphaZero is equivalent to <span class="color-cyan"><em>teaching the neural network to mimic MCTS search results</em></span>. As training progresses, the network's raw outputs resemble a search with a high number of simulations, making the model stronger.
          </textarea>
        </section>

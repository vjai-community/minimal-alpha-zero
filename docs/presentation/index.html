            ## 1. Overview
            ### 1.3. Challenges
            - System Design: Handling data pipelines is often more difficult than training models, as it <span class="color-cyan"><em>requires advanced engineering skills</em></span> to fully optimize.
            - Board Game Properties:
              - The number of possible board positions can be <span class="color-cyan"><em>astronomically huge</em></span>. For example, in Go, it is roughly $10^{170}$.
              - Small input size but <span class="color-cyan"><em>highly dense information</em></span>.
              - The value of a state is subjective to the player's perspective and can <span class="color-cyan"><em>shift dramatically even with minor changes</em></span>.
              - The final result is <span class="color-cyan"><em>difficult to predict</em></span> from an early state, even for strong players.
          </textarea>

          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.1. Quick Introduction
            #### Monte Carlo methods
            <div style="display: grid; grid-template-columns: 60% 40%;">
              <div>A broad class of computational algorithms based on repeated random sampling for obtaining numerical results.</div>
              <div>
                <img style="height: 128px;" src="https://upload.wikimedia.org/wikipedia/commons/f/ff/Approximation_d%27une_distribution_normale.gif"/>
                <img style="height: 128px;" src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Pi_monte_carlo_all.gif"/>
                </div>
            </div>

            #### Search Algorithms in Board Games
            - Minimax
            - Alpha-Beta Pruning
            - MCTS (Monte Carlo Tree Search)
            - ...
            <br/><br/>

            <span class="color-cyan"><em>AlphaZero uses a variant of MCTS algorithm, combining it with deep neural networks to guide the search process more efficiently and accurately</em></span>.
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.2. Key Features
            - Requirements: A "model" (e.g., neural network) for "prior estimation":
              - Takes a game <span class="color-cyan"><em>state</em></span> as input data.
              - Predicts output data including <span class="color-cyan"><em>prior probabilities (policy)</em></span> and a <span class="color-cyan"><em>state value</em></span>.
            - Results: Improved <span class="color-cyan"><em>search probabilities</em></span>.

            <object data="slides/en/mcts-key_features.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
          </textarea>
        </section>

            <p style="font-size: initial;">whereas <span class="color-cyan"><em>choosing the next actual move</em></span> involves sampling from <span class="color-cyan"><em>the search probabilities</em></span> accumulated across <span class="color-cyan"><em>multiple MCTS simulations</em></span>.</p>

        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.4. Example: Tic-tac-toe Game (1/2)
            #### MCTS Simulations
            <p style="font-size: initial;">For simplicity, we use a dummy model that assigns <span class="color-cyan"><em>uniform prior probabilities</em></span> to all actions and <span class="color-cyan"><em>zero values</em></span> to all states (excluding terminal ones).</p>
            <p style="font-size: initial;">Despite these imperfect predictions, the MCTS algorithm finds optimal solutions: Over more iterations, <span class="color-cyan"><em>nodes leading to victory are visited with increasing frequency</em></span>.</p>
            <p style="font-size: initial;" class="color-yellow">IMPORTANT</p>
            <p style="font-size: initial;">While actions are selected consecutively during simulation, these are only "investigations". Actual moves occur only after all simulations finish.</p>
            <iframe data-src="slides/en/mcts-example-multiple_simulations.html" data-preload class="wide-content" style="max-width: 100%; width: 100%; height: 100vh;"></iframe>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.4. Example: Tic-tac-toe Game (2/2)
            #### Choosing Next Move
            <p style="font-size: initial;">After executing <span class="color-cyan"><em>multiple MCTS simulations</em></span>, <span class="color-cyan"><em>visit counts</em></span> are used to calculate <span class="color-cyan"><em>the search probabilities</em></span>, which are stronger than <span class="color-cyan"><em>the prior probabilities</em></span> (predicted by the model) in terms of choosing a good next move.</p>
            <p style="font-size: initial;">The tree search plays the role of both players: at each node, it <span class="color-cyan"><em>changes perspective</em></span> to seek the best strategy for the current player.</p>
            <p>
              <object data="slides/en/mcts-example-choosing_next_move.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
            </p>
            <p style="font-size: initial;">In this presentation, I used a temperature of 1 to calculate the search probabilities from visit counts.</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.5. Critical Points (1/2)
            <span class="color-cyan"><em>How does the model's performance affect the algorithm's results</em></span>? What if the model is very immature (e.g., assigns high probabilities to low-value actions) and prevents the search from finding good moves?<br/>
            <br/>
            In practice, this is not a major issue because:
            - PUCT scores (used to select nodes during each simulation) increasingly <span class="color-cyan"><em>favor high-value nodes as simulations grow</em></span>.
            - The algorithm does not rely solely on the model's "prior estimation", it also <span class="color-cyan"><em>uses actual rewards from terminal nodes</em></span>.
            <br/><br/>

            That means, <span class="color-cyan"><em>given enough simulations, MCTS can still find strong moves</em></span>, regardless of the model's quality.
            <p style="font-size: initial;">Please refer to the Appendix for further details.</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 2. MCTS (Monte Carlo Tree Search)
            ### 2.5. Critical Points (2/2)
            MCTS simulations are capable of choosing a good move despite imperfect predictions from the model for a given state.<br/>
            So, <span class="color-cyan"><em>why do we need to train a model</em></span>? Are MCTS simulations not enough?<br/>
            <br/>
            The reason is that <span class="color-cyan"><em>MCTS simulations are time-consuming</em></span> and can be infeasible for complex board games.<br/>
            Training a model is equivalent to <span class="color-cyan"><em>increasing the total number of simulations</em></span>, thereby <span class="color-cyan"><em>further improving the strength of the MCTS algorithm</em></span>.
            <div style="font-size: 0.6em;">
              <ul>
                <li>Iteration 0: The model is naive; we must execute at least 100 simulations by default to find good moves.</li>
                <li>Iteration 1: The model is slightly better, and with the default 100 simulations, it is equivalent to executing a total of 200 simulations, allowing it to choose better moves.</li>
                <li>Iteration 2: The model is much better; it is now equivalent to executing 300 simulations and helps us achieve even better performance.</li>
                <li>...</li>
              </ul>
            </div>
          </textarea>
        </section>

            ## 3. Data Collection
            ### 3.1. Overview
            - Data is generated during self-play using the best model from the previous iteration.
            - Each data point includes:
              - Input data: Represents <span class="color-cyan"><em>the state</em></span> for an individual move.
              - Output data: Includes two parts
                - <span class="color-cyan"><em>Search probabilities</em></span>: Calculated using visit counts from MCTS simulations.
                - <span class="color-cyan"><em>Value</em></span>: The reward received after the game is finished.
          </textarea>

            ## 5. Minimal Implementation
            ### 5.1. Source Code
            [https://github.com/vjai-community/minimal-alpha-zero](https://github.com/vjai-community/minimal-alpha-zero)
            - Implemented <span class="color-cyan"><em>the AlphaZero algorithm from scratch</em></span> (using Flax for model training).
            - Trained for an [m,n,k-game](https://en.wikipedia.org/wiki/M,n,k-game) on <span class="color-cyan"><em>a small board</em></span> (m=6, n=5, k=4).
            - The model is <span class="color-cyan"><em>lightweight</em></span> and does not require a GPU.
            - Training completes within several hours (on a MacBook or Ryzen with multiple cores).
            - Contributions welcome! 🤗🤗

            <p style="display: flex; justify-content: center;">
              <object data="slides/en/overview-mnk_game.drawio.svg" type="image/svg+xml" style="height: 25vh;"></object>

        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (1/3)
            #### Empty Board
            The model learned that, starting from an empty board, the first player should <span class="color-cyan"><em>focus on the center of the board</em></span>.
            <object data="slides/en/interesting_insights-empty_board.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
            <p style="font-size: initial;">I never taught the model this knowledge; it figured it out on its own!</p>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (2/3)
            #### Threats
            Even after training, the model is still not smart enough to recognize all threats; <span class="color-cyan"><em>the key to AlphaZero's strength lies in MCTS</em></span>.
            <object data="slides/en/interesting_insights-threats.drawio.svg" type="image/svg+xml" style="width: 100%;"></object>
          </textarea>
        </section>
        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 5. Minimal Implementation
            ### 5.2. Interesting Insights (3/3)
            #### Others
            - <span class="color-cyan"><em>Understanding and processing the data are far more important</em></span> than designing the model.
            - <span class="color-cyan"><em>Data collection is more time-consuming</em></span> than model training.<br/>
            - Generally speaking, <span class="color-cyan"><em>implementing an effective reinforcement learning system is a big challenge</em></span>.<br/>
            You must address every stage of the process, from the data pipeline and resource constraints to model architecture optimization and, in some cases, hardware integration.
          </textarea>
        </section>

        <section data-markdown style="text-align: left;">
          <textarea data-template>
            ## 6. Summary
            ### 6.1. Core Takeaways
            - Given enough time and a sufficiently large number of simulations, <span class="color-cyan"><em>MCTS can find the optimal path</em></span> to a high reward, regardless of how inaccurate the initial prior probabilities and state values are.
            - Training in AlphaZero is equivalent to <span class="color-cyan"><em>teaching the neural network to mimic MCTS search results</em></span>. As training progresses, the network's raw outputs resemble a search with a high number of simulations, making the model stronger.
          </textarea>
        </section>
